base-image: ghcr.io/ublue-os/bazzite
image-version: stable

name: debrid-livingroom-os
description: SteamOS console with on-demand Real-Debrid game installing, Stremio, and Norwegian IPTV.

modules:
  - type: rpm-ostree
    install:
      - rclone
      - docker
      - docker-compose
      - zenity

  # Hypnotix finnes ikke som Flatpak på Flathub (bekreftet: 0 treff på Flathub-søk,
  # og "requested but never ported" på Flathub sitt forum), og den eneste Fedora
  # COPR-pakken (musuruan/multimedia) har en ødelagt python3-cinemagoer-avhengighet
  # for Fedora 44. Bruker i stedet "Open TV" (dev.fredol.open-tv) - en aktivt
  # vedlikeholdt, verifisert Flatpak-IPTV-spiller (M3U/Xtream, kategorier,
  # favoritter, opptak, fjernkontroll-støtte) med 150k+ installasjoner.
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.stremio.Stremio
          - dev.fredol.open-tv

  - type: files
    files:
      - source: system_files
        destination: /

  - type: systemd
    system:
      enabled:
        - docker.service
        - debrid-first-boot-dirs.service
    user:
      enabled:
        - rclone-mount-debrid.service

  - type: script
    scripts:
      - setup-permissions.sh
      - disable-terra-mesa-repo.sh
