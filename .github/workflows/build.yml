name: Build Debrid Livingroom OS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "00 17 * * *" # Bygg på nytt hver dag kl 17:00 UTC for å plukke opp oppdateringer

env:
  # Må matche recipe.yml sitt "name:"-felt - blue-build/github-action tagger og
  # pusher imaget under DETTE navnet, IKKE under GitHub-repoets navn (som er "baz").
  IMAGE_NAME: debrid-livingroom-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg OCI-image med BlueBuild
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_full_ref: ${{ steps.bluebuild.outputs.image_full_ref }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bygg og push image
        id: bluebuild
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # Signering er skrudd av for nå (ingen cosign-nøkkelpar satt opp ennå).
          # Fjern denne linjen og sett cosign_private_key-inputen om du vil signere imaget senere.
          build_opts: --no-sign

# ISO-en bygges IKKE lenger i CI: Bazzite-baserte images er for store (15-20+ GB)
# til å publiseres som GitHub Release-filer (2 GB maks-grense per fil). Siden ISO-en
# uansett bare skal flashes lokalt til USB, bygges den i stedet på egen PC - se
# scripts/build-iso-local.sh for en ferdig kommando som gjenbruker samme oppskrift
# som fungerte i CI (podman pull + bootc-image-builder --type iso --rootfs btrfs).
