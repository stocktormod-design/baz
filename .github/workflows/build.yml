name: Build and Release Debrid Livingroom OS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "00 17 * * *" # Bygg på nytt hver dag kl 17:00 UTC for å plukke opp oppdateringer

env:
  # Må matche recipe.yml sitt "name:"-felt - blue-build/github-action tagger og
  # pusher imaget under DETTE navnet, IKKE under GitHub-repoets navn (som er "baz").
  IMAGE_NAME: debrid-livingroom-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DEFAULT_TAG: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg OCI-image med BlueBuild
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_full_ref: ${{ steps.bluebuild.outputs.image_full_ref }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Bygg og push image
        id: bluebuild
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # Signering er skrudd av for nå (ingen cosign-nøkkelpar satt opp ennå).
          # Fjern denne linjen og sett cosign_private_key-inputen om du vil signere imaget senere.
          build_opts: --no-sign

  build-iso:
    name: Generer ISO og publiser Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sett dato-tag for release
        id: vars
        run: echo "tag=$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Opprett minimal bootc-image-builder-konfig
        run: |
          cat > config.toml <<'EOF'
          [[customizations.user]]
          name = "deck"
          groups = ["wheel"]
          EOF

      - name: Generer ISO med bootc-image-builder
        run: |
          mkdir -p output

          # bootc-image-builder bruker internt podman til å inspisere imaget fra
          # /var/lib/containers/storage, og pull'er ikke selv lenger - vi må derfor
          # pull'e imaget inn i podman sin lokale storage FØR vi kjører det.
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"

          sudo docker run \
            --rm \
            --privileged \
            --pull=always \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/config.toml:/config.toml:ro" \
            -v "$(pwd)/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            --config /config.toml \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"

          echo "=== Innhold i output/ etter bygg (for feilsøking av filsti) ==="
          find output -maxdepth 3 -type f

      - name: Last opp ISO til GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Debrid Livingroom OS ${{ steps.vars.outputs.tag }}"
          files: output/**/*.iso
          generate_release_notes: true
